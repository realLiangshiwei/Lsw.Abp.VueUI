packages:
  - docs
  - packages/*
  - playground
  - templates/*

# lefthook ships its binary as a platform-specific optional dependency, so the
# postinstall it also carries has nothing left to do.
allowBuilds:
  # esbuild fetches its platform binary in a postinstall; size-limit needs it.
  esbuild: true
  # vue-demi (under reka-ui) writes its Vue 2 / Vue 3 shim in a postinstall. Without it
  # the entry point is a placeholder that throws on import.
  vue-demi: true
  lefthook: false

peerDependencyRules:
  allowedVersions:
    # `tsconfck`, under vite-tsconfig-paths, still names TypeScript 5 as its peer. The
    # repo is locked to 6.0.3 (M0), and all it does with it is parse a tsconfig.
    tsconfck>typescript: '6'
