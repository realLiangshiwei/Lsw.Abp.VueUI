name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm --filter playground bench:build
      - run: pnpm size

      # Preview builds for every commit and PR, installable straight from the URL
      # pkg.pr.new prints. Nothing goes to npm; entries are purged after a month.
      - run: pnpm exec pkg-pr-new publish './packages/*' --pnpm

  # The CLI writes files and joins paths, which is the one part of this repository whose
  # behaviour differs per platform. Everything else runs in a browser.
  cli-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lsw-abpvue/cli test
        # `e2e/specs/abp-new.spec.ts` is not among these: it needs the .NET SDK, the
        # official ABP CLI and a template download from get.abp.io. It is run by hand with
        # ABPVUE_E2E_ABP=1, and what it proves is written down in the milestone notes.

  # The declarations we publish have to be readable by projects on an older TypeScript
  # than the one we build with. Kept separate so a failure here is unmistakable.
  downstream-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:published-types
      # What a consumer's toolchain makes of the manifest and the entry points.
      - run: pnpm check:resolution
      # One physical copy of each package in a consumer's tree, and declarations that
      # work after a plain `pnpm add`. Neither can be proven from inside the workspace.
      - run: pnpm check:external-install
      # Releasing a package's source into a project that installed it, then compiling and
      # building that project. The frontend template is exercised end to end on the way.
      - run: pnpm check:source-code-release
      # A package `abpv create-lib` writes is a repository of its own: it has to install,
      # type check and build with the ABP Vue packages coming from a registry rather than
      # from this workspace.
      - run: pnpm check:create-lib
