name: Release dev

# Manual for now: nothing is published until the scope is claimed on npm and
# NPM_TOKEN is in the repository secrets. Switch back to `push: branches: [main]`
# once both are done — every merge is meant to go out as a dev build.
on:
  workflow_dispatch:

concurrency:
  group: release-dev
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/set-dev-version.mjs ${{ github.sha }}
      # Versions are stamped in the working tree and never committed, so --no-git-checks.
      - run: pnpm --filter "./packages/*" publish --tag dev --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
